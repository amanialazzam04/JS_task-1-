
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Editor Task</title>
  <link rel="stylesheet" href="task(5).css">
</head>
<body>

  <!-- شريط التحكم التفاعلي -->
  <div class="controls">
    <!-- قائمة نوع الخط -->
    <select id="fontFamilySelect" onchange="applyStyles()">
      <option value="Times New Roman">Times New Roman</option>
      <option value="Arial">Arial</option>
      <option value="Fantasy">Fantasy</option>
      <option value="Courier New">Courier New</option>
    </select>

    <!-- قائمة حجم الخط -->
    <select id="fontSizeSelect" onchange="applyStyles()">
      <option value="10px">10px</option>
      <option value="15px">15px</option>
      <option value="20px">20px</option>
      <option value="25px">25px</option>
    </select>

    <!-- مربعات الاختيار للخط -->
    <label><input type="checkbox" id="italicCheck" onchange="applyStyles()"> Italic</label>
    <label><input type="checkbox" id="boldCheck" onchange="applyStyles()"> Bold</label>
    <label><input type="checkbox" id="underlineCheck" onchange="applyStyles()"> Underline</label>
  </div>

  <!-- مربع إدخال النص -->
  <textarea id="textInput" placeholder="Write something here...">the quick brown fox over the lazy dog</textarea>

  <script src="task(5).js"></script>
</body>
</html>
